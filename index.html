<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Budget Planner</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#ffd3e6" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Budget" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="icon" href="./icons/icon-512.png" />

<style>
  :root {
    --bg: #fff0f6;
    --bg-elev: #ffffff;
    --bg-elev-2: #fff2f8;
    --border: #ffd3e6;
    --text: #6d4257;
    --text-dim: #c087a4;
    --accent: #ff85b3;
    --accent-dim: #ffc2da;
    --red: #ff6f91;
    --yellow: #ffcf5c;
    --blue: #8ecae6;
    --radius: 18px;
    --shadow: 0 6px 18px rgba(255, 133, 179, 0.18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 100% -10%, #ffe0ef 0%, rgba(255,224,239,0) 60%),
      radial-gradient(900px 500px at -10% 110%, #e9dcff 0%, rgba(233,220,255,0) 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Comic Sans MS", "Quicksand", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: 60px;
  }
  #root { max-width: 1100px; margin: 0 auto; padding: 16px; }

  header.top {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    padding: 12px 4px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  header.top h1 { font-size: 22px; margin: 0; font-weight: 800; letter-spacing: 0.3px; }
  .month-switcher { display: flex; align-items: center; gap: 8px; }
  .month-switcher button.nav {
    background: var(--bg-elev); border: 2px solid var(--border); color: var(--accent);
    border-radius: 999px; width: 34px; height: 34px; cursor: pointer; font-size: 16px;
    box-shadow: var(--shadow);
  }
  .month-switcher button.nav:hover { background: var(--accent-dim); }
  .month-label { min-width: 140px; text-align: center; font-weight: 500; }
  select, input, textarea {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 14px;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
  button { font-family: inherit; }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }
  .summary-card {
    background: var(--bg-elev);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow);
  }
  .summary-card .label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .summary-card .value { font-size: 19px; font-weight: 600; }
  .summary-card .sum-note { font-size: 11px; color: var(--text-dim); margin-top: 4px; min-height: 14px; }
  .pos { color: var(--accent); }
  .neg { color: var(--red); }

  section.block { margin-bottom: 32px; }
  section.block > h2 {
    font-size: 17px;
    margin: 0 0 12px;
    color: var(--accent);
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .categories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
  }
  .category-card {
    background: var(--bg-elev);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow);
  }
  .category-card h3 {
    margin: 0 0 4px;
    font-size: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .category-card .planned-row { display: flex; align-items: center; gap: 8px; margin: 6px 0 10px; }
  .category-card .planned-row label { font-size: 12px; color: var(--text-dim); }
  .category-card .planned-row input { flex: 1; min-width: 0; text-align: right; }
  .category-card .planned-row .cur-symbol { font-size: 13px; color: var(--text-dim); }
  .category-card .cat-totals { font-size: 14px; font-weight: 600; color: var(--text); }
  .subcat-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .subcat-row input.name { flex: 1; min-width: 0; }
  .subcat-row input.planned { width: 80px; text-align: right; }
  .subcat-row .spent-tag {
    font-size: 11px;
    color: var(--text-dim);
    min-width: 60px;
    text-align: right;
  }
  .icon-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .icon-btn:hover { color: var(--red); background: var(--bg-elev-2); }
  .add-link {
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--accent);
    cursor: pointer;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    width: 100%;
    margin-top: 4px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  .tx-amount { text-align: right; font-weight: 500; }
  .row-edit {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 5px 7px;
    font-size: 13px;
    color: var(--text);
    width: 100%;
    max-width: 100%;
  }
  .row-edit:hover { border-color: var(--border); background: var(--bg-elev-2); }
  .row-edit:focus { border-color: var(--accent); background: var(--bg-elev-2); outline: none; }
  .row-edit.amount { text-align: right; }
  td .row-edit[type="date"] { min-width: 120px; }
  .tx-form {
    display: grid;
    grid-template-columns: 120px 130px 130px 100px 1fr auto;
    gap: 8px;
    margin-bottom: 16px;
    align-items: center;
  }
  .row-actions { display: flex; gap: 2px; white-space: nowrap; }
  .manage-cat {
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-elev);
    box-shadow: var(--shadow);
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .manage-cat .mc-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .manage-cat .mc-head input.mc-name { flex: 1; min-width: 120px; font-weight: 700; }
  .manage-cat .mc-income { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .manage-cat .mc-sub { display: flex; align-items: center; gap: 6px; margin: 4px 0 4px 18px; }
  .manage-cat .mc-sub input { flex: 1; min-width: 0; }
  .manage-cat .mc-badge { font-size: 11px; color: var(--accent); font-weight: 700; }
  .chart-wrap {
    background: var(--bg-elev);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 24px;
  }
  .chart-legend { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
  .chart-legend .row { display: flex; align-items: center; gap: 8px; }
  .chart-legend .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .chart-legend .lg-name { min-width: 96px; }
  .chart-legend .lg-val { color: var(--text-dim); }
  @media (max-width: 760px) {
    .tx-form { grid-template-columns: 1fr 1fr; }
  }
  .btn-primary {
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  .btn-primary:hover { opacity: 0.9; }
  .table-wrap { overflow-x: auto; background: var(--bg-elev); border: 2px solid var(--border); border-radius: var(--radius); padding: 4px 12px; box-shadow: var(--shadow); }
  .empty-note { color: var(--text-dim); font-size: 13px; padding: 16px 0; text-align: center; }

  .funds-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
  }
  .fund-card {
    background: var(--bg-elev);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow);
  }
  .fund-card h3 { margin: 0 0 8px; font-size: 15px; display: flex; justify-content: space-between; }
  .fund-meta { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 10px; }
  .progress-track {
    background: var(--bg-elev-2);
    border-radius: 999px;
    height: 10px;
    overflow: hidden;
    margin: 8px 0;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  .fund-form {
    display: grid;
    grid-template-columns: 1fr 100px 100px auto;
    gap: 8px;
    margin-bottom: 14px;
  }
  @media (max-width: 760px) {
    .fund-form { grid-template-columns: 1fr 1fr; }
  }
  .fund-actions { display: flex; gap: 6px; margin-top: 8px; }
  .fund-actions button {
    flex: 1;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 12px;
    cursor: pointer;
  }
  .fund-actions button:hover { border-color: var(--accent); }

  footer.app-footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    padding-top: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .footer-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .footer-btn {
    background: var(--bg-elev);
    border: 2px solid var(--border);
    color: var(--accent);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .footer-btn:hover { background: var(--accent-dim); }
  .reset-btn {
    background: transparent;
    border: 2px solid var(--border);
    color: var(--red);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .reset-btn:hover { border-color: var(--red); background: rgba(248, 113, 113, 0.08); }
  .install-banner {
    background: var(--bg-elev-2);
    border: 1px solid var(--accent-dim);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .install-banner button {
    background: var(--accent);
    border: none;
    color: #ffffff;
    border-radius: 8px;
    padding: 6px 12px;
    font-weight: 600;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================================================
   Budget Planner — single file, zero dependencies, no build.
   Works by double-clicking index.html (file://) and offline.
   ============================================================ */
(function () {
  "use strict";

  var STORAGE_KEY = "budgetPlannerData_v1";
  var CURRENCIES = [
    { code: "EUR", symbol: "€" },
    { code: "USD", symbol: "$" },
    { code: "GBP", symbol: "£" },
    { code: "CHF", symbol: "CHF" },
    { code: "JPY", symbol: "¥" },
    { code: "CAD", symbol: "CA$" },
    { code: "AUD", symbol: "AU$" }
  ];

  var COLOR_PALETTE = ["#8ecae6", "#ffd166", "#c9a7eb", "#ff9aa2", "#a0e7c8", "#f7a4c8", "#b5e48c", "#ffb4a2", "#a2d2ff", "#ffc6ff"];

  /* ---------- helpers ---------- */
  function svgEl(tag, attrs) {
    var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); }
    return e;
  }
  function slicePath(cx, cy, r, a0, a1) {
    var x0 = cx + r * Math.sin(a0), y0 = cy - r * Math.cos(a0);
    var x1 = cx + r * Math.sin(a1), y1 = cy - r * Math.cos(a1);
    var large = (a1 - a0) > Math.PI ? 1 : 0;
    return "M" + cx + "," + cy + " L" + x0 + "," + y0 +
      " A" + r + "," + r + " 0 " + large + " 1 " + x1 + "," + y1 + " Z";
  }
  function catById(id) { return state.categories.filter(function (c) { return c.id === id; })[0]; }
  function subById(cat, id) { if (!cat || !id) return null; return cat.subs.filter(function (s) { return s.id === id; })[0]; }
  function isIncomeTx(tx) { var c = catById(tx.catId); return c ? !!c.income : false; }
  // Total per category id (works for income & outflow), from a month's transactions.
  function catTotals(md) {
    var m = {};
    md.transactions.forEach(function (tx) { m[tx.catId] = (m[tx.catId] || 0) + num(tx.amount); });
    return m;
  }
  function colorForCat(catId) {
    var outflow = state.categories.filter(function (c) { return !c.income; });
    var idx = outflow.map(function (c) { return c.id; }).indexOf(catId);
    return COLOR_PALETTE[(idx < 0 ? 0 : idx) % COLOR_PALETTE.length];
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function monthKey(date) {
    return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0");
  }
  function monthLabel(key) {
    var p = key.split("-").map(Number);
    return new Date(p[0], p[1] - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
  }
  function shiftMonth(key, delta) {
    var p = key.split("-").map(Number);
    return monthKey(new Date(p[0], p[1] - 1 + delta, 1));
  }
  function addMonths(date, months) {
    var d = new Date(date);
    d.setMonth(d.getMonth() + months);
    return d;
  }
  function num(v) {
    var n = Number(v);
    return isNaN(n) ? 0 : n;
  }
  function formatMoney(amount, currencyCode) {
    var cur = CURRENCIES.filter(function (c) { return c.code === currencyCode; })[0] || CURRENCIES[0];
    var n = num(amount);
    var sign = n < 0 ? "-" : "";
    var abs = Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return sign + cur.symbol + abs;
  }

  /* el(tag, attrs, ...children) tiny DOM builder */
  function el(tag, attrs) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (!attrs.hasOwnProperty(k)) continue;
      var v = attrs[k];
      if (v == null) continue;
      if (k === "class") e.className = v;
      else if (k === "value") e.value = v;
      else if (k === "checked") e.checked = !!v;
      else if (k === "style" && typeof v === "object") { for (var s in v) e.style[s] = v[s]; }
      else if (k === "dataset") { for (var d in v) e.dataset[d] = v[d]; }
      else if (k.slice(0, 2) === "on" && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
      else e.setAttribute(k, v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      append(e, kid);
    }
    return e;
  }
  function append(parent, kid) {
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(function (c) { append(parent, c); }); return; }
    parent.appendChild(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
  }

  /* ---------- data ----------
     Global taxonomy:
       state.categories = [ { id, name, income:bool, subs:[ {id,name} ] } ]
     Per month:
       state.months[key] = { transactions: [ {id,date,catId,subId,amount,description} ] } */
  function defaultTaxonomy() {
    return [
      { id: "cat_income", name: "Income", income: true, subs: [] },
      { id: "cat_expenses", name: "Expenses", income: false, subs: [] },
      { id: "cat_bills", name: "Bills", income: false, subs: [] },
      { id: "cat_subscriptions", name: "Subscriptions", income: false, subs: [] },
      { id: "cat_debts", name: "Debts", income: false, subs: [] },
      { id: "cat_savings", name: "Savings", income: false, subs: [] }
    ];
  }
  function freshData() {
    var today = monthKey(new Date());
    var d = { currency: "EUR", currentMonth: today, categories: defaultTaxonomy(), months: {}, sinkingFunds: [] };
    d.months[today] = { transactions: [] };
    return d;
  }
  // Normalize a parsed data object (from storage or an imported file), migrating
  // older shapes (per-month name-keyed categories, name-based transactions).
  function migrateLoaded(d) {
    if (!d || typeof d !== "object") d = {};
    d.currency = d.currency || "EUR";
    if (!Array.isArray(d.sinkingFunds)) d.sinkingFunds = [];
    if (!d.months || typeof d.months !== "object") d.months = {};

    var tax;
    if (Array.isArray(d.categories) && d.categories.length) {
      tax = d.categories.map(function (c) {
        return {
          id: c.id || uid(),
          name: String(c.name || "Category"),
          income: !!c.income,
          subs: Array.isArray(c.subs) ? c.subs.map(function (s) { return { id: s.id || uid(), name: String(s.name || "Item") }; }) : []
        };
      });
    } else {
      tax = defaultTaxonomy();
    }
    function catByName(name) { return tax.filter(function (c) { return c.name === name; })[0]; }
    function ensureCat(name) {
      var c = catByName(name);
      if (!c) { c = { id: uid(), name: name, income: (name === "Income"), subs: [] }; tax.push(c); }
      return c;
    }
    function ensureSub(cat, name) {
      if (!name) return null;
      var s = cat.subs.filter(function (x) { return x.name === name; })[0];
      if (!s) { s = { id: uid(), name: name }; cat.subs.push(s); }
      return s;
    }

    Object.keys(d.months).forEach(function (mk) {
      var m = d.months[mk] || {};
      // old per-month name-keyed categories: fold any custom names into taxonomy
      if (m.categories && !Array.isArray(m.categories)) {
        Object.keys(m.categories).forEach(function (nm) { ensureCat(nm); });
      }
      delete m.categories;
      if (!Array.isArray(m.transactions)) m.transactions = [];
      m.transactions = m.transactions.map(function (tx) {
        var t = {
          id: tx.id || uid(),
          date: tx.date || (mk + "-01"),
          amount: num(tx.amount),
          description: tx.description || ""
        };
        if (tx.catId) {
          t.catId = tx.catId;
          t.subId = tx.subId || null;
        } else {
          var cat = ensureCat(tx.category || "Expenses");
          t.catId = cat.id;
          var sub = ensureSub(cat, tx.subCategory);
          t.subId = sub ? sub.id : null;
        }
        return t;
      });
      d.months[mk] = m;
    });
    d.categories = tax;

    var keys = Object.keys(d.months);
    if (!d.currentMonth || !d.months[d.currentMonth]) {
      d.currentMonth = keys.length ? keys.sort()[keys.length - 1] : monthKey(new Date());
    }
    if (!d.months[d.currentMonth]) d.months[d.currentMonth] = { transactions: [] };
    return d;
  }
  function loadData() {
    var d;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) d = JSON.parse(raw);
    } catch (e) { /* ignore */ }
    if (!d) return freshData();
    return migrateLoaded(d);
  }
  function exportData() {
    try {
      var json = JSON.stringify(state, null, 2);
      var blob = new Blob([json], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "budget-planner-" + monthKey(new Date()) + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) {
      window.alert("Export failed: " + e.message);
    }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  var state = loadData();

  function ensureMonth(key) {
    if (!state.months[key]) {
      state.months[key] = { transactions: [] };
      save();
    }
    return state.months[key];
  }
  function currentMonthData() { return ensureMonth(state.currentMonth); }

  function monthActuals(md) {
    var spent = 0, actualIncome = 0;
    md.transactions.forEach(function (tx) {
      if (isIncomeTx(tx)) actualIncome += num(tx.amount);
      else spent += num(tx.amount);
    });
    return { spent: spent, actualIncome: actualIncome };
  }
  // Carryover = the previous (existing) month's "Left to Spend", chained back.
  function carryoverInto(monthKey) {
    var prev = shiftMonth(monthKey, -1);
    if (!state.months[prev]) return 0;
    return leftToSpendOf(prev);
  }
  function leftToSpendOf(monthKey) {
    var md = state.months[monthKey];
    if (!md) return 0;
    var a = monthActuals(md);
    return carryoverInto(monthKey) + a.actualIncome - a.spent;
  }
  function computeTotals(md, monthKey) {
    var a = monthActuals(md);
    var carry = carryoverInto(monthKey);
    var income = carry + a.actualIncome;
    return {
      income: income,
      spent: a.spent,
      leftToSpend: income - a.spent,
      carryover: carry
    };
  }

  /* ---------- live (non-destructive) recompute ---------- */
  function updateComputed() {
    var md = currentMonthData();
    var cs = catTotals(md);
    var t = computeTotals(md, state.currentMonth);
    var cur = state.currency;

    var sumDefs = {
      income: { v: t.income, cls: "" },
      spent: { v: t.spent, cls: "" },
      leftToSpend: { v: t.leftToSpend, cls: t.leftToSpend < 0 ? "neg" : "pos" }
    };
    Object.keys(sumDefs).forEach(function (id) {
      var node = document.querySelector('[data-sum="' + id + '"]');
      if (node) { node.textContent = formatMoney(sumDefs[id].v, cur); node.className = "value " + sumDefs[id].cls; }
    });
    var noteNode = document.querySelector('[data-sum-note="income"]');
    if (noteNode) {
      noteNode.textContent = t.carryover ? "incl. " + formatMoney(t.carryover, cur) + " from last month" : "";
    }

    // category totals (actual only, per category id)
    var catNodes = document.querySelectorAll("[data-cat-totals]");
    Array.prototype.forEach.call(catNodes, function (node) {
      var catId = node.getAttribute("data-cat-totals");
      var c = catById(catId);
      node.textContent = ((c && c.income) ? "Received " : "Spent ") + formatMoney(cs[catId] || 0, cur);
    });

    // funds
    var fundNodes = document.querySelectorAll("[data-fund-id]");
    Array.prototype.forEach.call(fundNodes, function (card) {
      var id = card.getAttribute("data-fund-id");
      var f = state.sinkingFunds.filter(function (x) { return x.id === id; })[0];
      if (!f) return;
      var pct = f.target > 0 ? Math.min(100, (f.saved / f.target) * 100) : 0;
      var remaining = Math.max(0, f.target - f.saved);
      var monthsLeft = f.monthlyContribution > 0 ? Math.ceil(remaining / f.monthlyContribution) : null;
      var completion = monthsLeft !== null
        ? addMonths(new Date(), monthsLeft).toLocaleDateString(undefined, { month: "short", year: "numeric" })
        : "—";
      var fill = card.querySelector(".progress-fill"); if (fill) fill.style.width = pct + "%";
      var setTxt = function (sel, txt) { var n = card.querySelector(sel); if (n) n.textContent = txt; };
      setTxt(".f-target", "Target: " + formatMoney(f.target, cur));
      setTxt(".f-saved", "Saved: " + formatMoney(f.saved, cur));
      setTxt(".f-pct", pct.toFixed(0) + "% funded");
      setTxt(".f-monthsleft", monthsLeft !== null ? monthsLeft + " months left" : "Set a monthly contribution");
      setTxt(".f-completion", "Est. completion: " + completion);
    });
  }

  /* ---------- environment ---------- */
  function isStandalone() {
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
      window.navigator.standalone === true;
  }
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var installEvent = null;
  var installDismissed = false;

  /* ---------- sections ---------- */
  function renderHeader() {
    return el("header", { class: "top" },
      el("h1", {}, "🌸 Budget Planner"),
      el("div", { class: "month-switcher" },
        el("button", { class: "nav", onclick: function () { state.currentMonth = shiftMonth(state.currentMonth, -1); save(); fullRender(); } }, "‹"),
        el("div", { class: "month-label" }, monthLabel(state.currentMonth)),
        el("button", { class: "nav", onclick: function () { state.currentMonth = shiftMonth(state.currentMonth, 1); save(); fullRender(); } }, "›")
      ),
      el("select", { onchange: function (e) { state.currency = e.target.value; save(); fullRender(); } },
        CURRENCIES.map(function (c) {
          return el("option", { value: c.code, selected: c.code === state.currency ? "selected" : null }, c.code + " (" + c.symbol + ")");
        })
      )
    );
  }

  function renderInstallBanner() {
    if (isStandalone() || installDismissed) return null;
    var msg;
    if (isIOS) msg = el("span", {}, 'Install on your iPhone/iPad: tap Share → "Add to Home Screen".');
    else if (installEvent) msg = el("span", {}, "Install this app for quick access from your dock or home screen.");
    else msg = el("span", {}, 'Tip: use your browser\'s "Install app" / "Add to Dock" option for offline access.');

    var buttons = [];
    if (installEvent) {
      buttons.push(el("button", { onclick: function () {
        installEvent.prompt();
        installEvent.userChoice.finally && installEvent.userChoice.finally(function () { installEvent = null; fullRender(); });
        installEvent = null;
      } }, "Install"));
    }
    buttons.push(el("button", {
      style: { background: "transparent", color: "var(--text-dim)", border: "1px solid var(--border)" },
      onclick: function () { installDismissed = true; fullRender(); }
    }, "Dismiss"));

    return el("div", { class: "install-banner" }, msg, el("div", { style: { display: "flex", gap: "8px" } }, buttons));
  }

  function renderSummary() {
    var defs = [
      { id: "income", label: "Income" },
      { id: "spent", label: "Spent" },
      { id: "leftToSpend", label: "Left to Spend" }
    ];
    return el("div", { class: "summary-grid" },
      defs.map(function (d) {
        return el("div", { class: "summary-card" },
          el("div", { class: "label" }, d.label),
          el("div", { class: "value", dataset: { sum: d.id } }, "—"),
          d.id === "income" ? el("div", { class: "sum-note", dataset: { sumNote: "income" } }, "") : null
        );
      })
    );
  }

  function renderCategories() {
    return el("section", { class: "block" },
      el("h2", {}, "🧁 Envelopes"),
      el("div", { class: "categories-grid" },
        state.categories.map(function (c) {
          return el("div", { class: "category-card" },
            el("h3", {}, c.name),
            el("div", { class: "cat-totals", dataset: { catTotals: c.id } }, "—")
          );
        })
      )
    );
  }

  function subOptionsFor(selectEl, catId, selectedSubId) {
    selectEl.innerHTML = "";
    selectEl.appendChild(el("option", { value: "", selected: !selectedSubId ? "selected" : null }, "—"));
    var c = catById(catId);
    if (c) c.subs.forEach(function (s) {
      selectEl.appendChild(el("option", { value: s.id, selected: s.id === selectedSubId ? "selected" : null }, s.name));
    });
  }

  function renderTransactions() {
    var md = currentMonthData();
    var todayStr = new Date().toISOString().slice(0, 10);
    var firstCat = state.categories[0];

    var dateInput = el("input", { type: "date", value: todayStr, required: "required" });
    var catSelect = el("select", {});
    state.categories.forEach(function (c) { catSelect.appendChild(el("option", { value: c.id }, c.name)); });
    var subSelect = el("select", {});
    function fillFormSubs() { subOptionsFor(subSelect, catSelect.value, ""); }
    catSelect.addEventListener("change", fillFormSubs);
    fillFormSubs();

    var amountInput = el("input", { type: "number", step: "0.01", placeholder: "Amount", required: "required" });
    var descInput = el("input", { type: "text", placeholder: "Description" });

    var form = el("form", { class: "tx-form", onsubmit: function (e) {
      e.preventDefault();
      if (amountInput.value === "" || !catSelect.value) return;
      md.transactions.push({
        id: uid(), date: dateInput.value, catId: catSelect.value,
        subId: subSelect.value || null, amount: num(amountInput.value), description: descInput.value
      });
      save(); fullRender();
    } },
      dateInput, catSelect, subSelect, amountInput, descInput,
      el("button", { class: "btn-primary", type: "submit" }, "Add")
    );

    var sorted = md.transactions.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var tableArea;
    if (sorted.length === 0) {
      tableArea = el("div", { class: "empty-note" }, "No transactions this month yet.");
    } else {
      tableArea = el("table", {},
        el("thead", {}, el("tr", {},
          el("th", {}, "Date"), el("th", {}, "Category"), el("th", {}, "Sub-category"),
          el("th", {}, "Description"), el("th", { style: { textAlign: "right" } }, "Amount"), el("th", {})
        )),
        el("tbody", {}, sorted.map(function (tx) {
          var rowCat = el("select", { class: "row-edit", onchange: function (e) {
            tx.catId = e.target.value; tx.subId = null; save(); fullRender();
          } });
          state.categories.forEach(function (c) {
            rowCat.appendChild(el("option", { value: c.id, selected: c.id === tx.catId ? "selected" : null }, c.name));
          });
          var rowSub = el("select", { class: "row-edit", onchange: function (e) {
            tx.subId = e.target.value || null; save();
          } });
          subOptionsFor(rowSub, tx.catId, tx.subId);

          return el("tr", {},
            el("td", {}, el("input", {
              class: "row-edit", type: "date", value: tx.date,
              onchange: function (e) { tx.date = e.target.value; save(); fullRender(); }
            })),
            el("td", {}, rowCat),
            el("td", {}, rowSub),
            el("td", {}, el("input", {
              class: "row-edit", type: "text", value: tx.description,
              onchange: function (e) { tx.description = e.target.value; save(); }
            })),
            el("td", { class: "tx-amount" }, el("input", {
              class: "row-edit amount", type: "number", step: "0.01", value: tx.amount,
              onchange: function (e) { tx.amount = num(e.target.value); save(); fullRender(); }
            })),
            el("td", {}, el("div", { class: "row-actions" },
              el("button", { class: "icon-btn", title: "Duplicate", onclick: function () {
                var copy = { id: uid(), date: tx.date, catId: tx.catId, subId: tx.subId || null, amount: tx.amount, description: tx.description };
                md.transactions.push(copy); save(); fullRender();
              } }, "⧉"),
              el("button", { class: "icon-btn", title: "Delete", onclick: function () {
                md.transactions = md.transactions.filter(function (t) { return t.id !== tx.id; });
                save(); fullRender();
              } }, "✕")
            ))
          );
        }))
      );
    }

    return el("section", { class: "block" },
      el("h2", {}, "🍡 Transactions"),
      form,
      el("div", { class: "table-wrap" }, tableArea)
    );
  }

  function renderFunds() {
    var nameInput = el("input", { type: "text", placeholder: "Goal name", required: "required" });
    var targetInput = el("input", { type: "number", step: "0.01", placeholder: "Target", required: "required" });
    var contribInput = el("input", { type: "number", step: "0.01", placeholder: "Monthly " + (CURRENCIES.filter(function (c) { return c.code === state.currency; })[0] || CURRENCIES[0]).symbol });

    var form = el("form", { class: "fund-form", onsubmit: function (e) {
      e.preventDefault();
      if (!nameInput.value || targetInput.value === "") return;
      state.sinkingFunds.push({
        id: uid(), name: nameInput.value, target: num(targetInput.value),
        monthlyContribution: num(contribInput.value), saved: 0
      });
      save(); fullRender();
    } },
      nameInput, targetInput, contribInput,
      el("button", { class: "btn-primary", type: "submit" }, "Add Goal")
    );

    var grid;
    if (state.sinkingFunds.length === 0) {
      grid = el("div", { class: "empty-note" }, "No sinking funds yet. Add a savings goal above.");
    } else {
      grid = el("div", { class: "funds-grid" },
        state.sinkingFunds.map(function (f) {
          return el("div", { class: "fund-card", dataset: { fundId: f.id } },
            el("h3", {},
              el("input", {
                value: f.name,
                style: { background: "transparent", border: "none", color: "inherit", fontSize: "15px", fontWeight: "600", padding: "0" },
                oninput: function (e) { f.name = e.target.value; save(); }
              }),
              el("button", { class: "icon-btn", title: "Delete", onclick: function () {
                state.sinkingFunds = state.sinkingFunds.filter(function (x) { return x.id !== f.id; });
                save(); fullRender();
              } }, "✕")
            ),
            el("div", { class: "fund-meta" },
              el("span", { class: "f-target" }, "—"),
              el("span", { class: "f-saved" }, "—")
            ),
            el("div", { class: "progress-track" }, el("div", { class: "progress-fill", style: { width: "0%" } })),
            el("div", { class: "fund-meta" },
              el("span", { class: "f-pct" }, "—"),
              el("span", { class: "f-monthsleft" }, "—"),
              el("span", { class: "f-completion" }, "—")
            ),
            el("div", { style: { display: "flex", gap: "8px", marginTop: "8px", alignItems: "center", flexWrap: "wrap" } },
              el("label", { style: { fontSize: "12px", color: "var(--text-dim)" } }, "Monthly"),
              el("input", {
                type: "number", step: "0.01", value: f.monthlyContribution, style: { width: "80px" },
                oninput: function (e) { f.monthlyContribution = num(e.target.value); save(); updateComputed(); }
              }),
              el("label", { style: { fontSize: "12px", color: "var(--text-dim)" } }, "Saved"),
              el("input", {
                type: "number", step: "0.01", value: f.saved, style: { width: "90px" },
                oninput: function (e) { f.saved = num(e.target.value); save(); updateComputed(); }
              })
            ),
            el("div", { class: "fund-actions" },
              el("button", { onclick: function () { f.saved = num(f.saved) + num(f.monthlyContribution); save(); fullRender(); } },
                "+ Log monthly contribution")
            )
          );
        })
      );
    }

    return el("section", { class: "block" },
      el("h2", {}, "🐷 Sinking Funds"),
      form,
      grid
    );
  }

  function renderChart() {
    var md = currentMonthData();
    var cs = catTotals(md);
    var data = state.categories
      .filter(function (c) { return !c.income; })
      .map(function (c) { return { id: c.id, name: c.name, val: cs[c.id] || 0 }; })
      .filter(function (d) { return d.val > 0; });
    var total = data.reduce(function (s, d) { return s + d.val; }, 0);

    var section = el("section", { class: "block" }, el("h2", {}, "🍰 Spending by category"));
    if (total <= 0) {
      section.appendChild(el("div", { class: "empty-note" }, "No spending recorded this month yet."));
      return section;
    }

    var size = 180, r = 82, cx = 90, cy = 90;
    var svg = svgEl("svg", { width: size, height: size, viewBox: "0 0 " + size + " " + size });
    if (data.length === 1) {
      svg.appendChild(svgEl("circle", { cx: cx, cy: cy, r: r, fill: colorForCat(data[0].id) }));
    } else {
      var angle = 0;
      data.forEach(function (d) {
        var a0 = angle, a1 = angle + (d.val / total) * 2 * Math.PI;
        angle = a1;
        svg.appendChild(svgEl("path", {
          d: slicePath(cx, cy, r, a0, a1),
          fill: colorForCat(d.id),
          stroke: "#ffffff", "stroke-width": 3
        }));
      });
    }
    // donut hole + total in center
    svg.appendChild(svgEl("circle", { cx: cx, cy: cy, r: 46, fill: "#ffffff" }));

    var legend = el("div", { class: "chart-legend" },
      data.map(function (d) {
        var pct = Math.round((d.val / total) * 100);
        return el("div", { class: "row" },
          el("span", { class: "swatch", style: { background: colorForCat(d.id) } }),
          el("span", { class: "lg-name" }, d.name),
          el("span", { class: "lg-val" }, formatMoney(d.val, state.currency) + " · " + pct + "%")
        );
      })
    );

    var chartArea = el("div", { class: "chart-wrap" });
    var svgBox = el("div", { style: { position: "relative", width: size + "px", height: size + "px", flex: "none" } });
    svgBox.appendChild(svg);
    svgBox.appendChild(el("div", {
      style: {
        position: "absolute", top: "0", left: "0", width: size + "px", height: size + "px",
        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
        pointerEvents: "none"
      }
    },
      el("div", { style: { fontSize: "11px", color: "var(--text-dim)" } }, "Total spent"),
      el("div", { style: { fontSize: "17px", fontWeight: "700" } }, formatMoney(total, state.currency))
    ));
    chartArea.appendChild(svgBox);
    chartArea.appendChild(legend);
    section.appendChild(chartArea);
    return section;
  }

  function countTxWithCat(catId) {
    var n = 0;
    Object.keys(state.months).forEach(function (mk) {
      state.months[mk].transactions.forEach(function (tx) { if (tx.catId === catId) n++; });
    });
    return n;
  }
  function deleteCategory(catId) {
    var used = countTxWithCat(catId);
    var msg = used > 0
      ? "Delete this category? " + used + " transaction(s) using it will also be deleted."
      : "Delete this category?";
    if (!window.confirm(msg)) return;
    state.categories = state.categories.filter(function (c) { return c.id !== catId; });
    Object.keys(state.months).forEach(function (mk) {
      state.months[mk].transactions = state.months[mk].transactions.filter(function (tx) { return tx.catId !== catId; });
    });
    save(); fullRender();
  }
  function deleteSub(cat, subId) {
    cat.subs = cat.subs.filter(function (s) { return s.id !== subId; });
    Object.keys(state.months).forEach(function (mk) {
      state.months[mk].transactions.forEach(function (tx) { if (tx.subId === subId) tx.subId = null; });
    });
    save(); fullRender();
  }

  function renderManageCategories() {
    return el("section", { class: "block" },
      el("h2", {}, "🗂️ Manage categories"),
      state.categories.map(function (c) {
        return el("div", { class: "manage-cat" },
          el("div", { class: "mc-head" },
            el("input", {
              class: "mc-name", value: c.name,
              onchange: function (e) { c.name = e.target.value || "Category"; save(); fullRender(); }
            }),
            el("label", { class: "mc-income" },
              el("input", {
                type: "checkbox", checked: c.income ? true : null,
                onchange: function (e) { c.income = e.target.checked; save(); fullRender(); }
              }),
              "counts as income"
            ),
            el("button", { class: "icon-btn", title: "Delete category", onclick: function () { deleteCategory(c.id); } }, "✕")
          ),
          c.subs.map(function (s) {
            return el("div", { class: "mc-sub" },
              el("span", { class: "mc-badge" }, "↳"),
              el("input", {
                value: s.name,
                onchange: function (e) { s.name = e.target.value || "Item"; save(); fullRender(); }
              }),
              el("button", { class: "icon-btn", title: "Delete sub-category", onclick: function () { deleteSub(c, s.id); } }, "✕")
            );
          }),
          el("button", { class: "add-link", onclick: function () {
            c.subs.push({ id: uid(), name: "New sub-category" }); save(); fullRender();
          } }, "+ Add sub-category")
        );
      }),
      el("button", { class: "add-link", style: { marginTop: "8px" }, onclick: function () {
        state.categories.push({ id: uid(), name: "New category", income: false, subs: [] });
        save(); fullRender();
      } }, "+ Add category")
    );
  }

  /* ---------- full render ---------- */
  function fullRender() {
    ensureMonth(state.currentMonth);
    var root = document.getElementById("root");
    root.innerHTML = "";
    append(root, renderHeader());
    append(root, renderInstallBanner());
    append(root, renderSummary());
    append(root, renderChart());
    append(root, renderCategories());
    append(root, renderTransactions());
    append(root, renderManageCategories());
    append(root, renderFunds());
    var importInput = el("input", {
      type: "file", accept: "application/json,.json", style: { display: "none" },
      onchange: function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var parsed = JSON.parse(reader.result);
            if (!parsed || typeof parsed !== "object" || !parsed.months) {
              window.alert("This file doesn't look like a Budget Planner export.");
              return;
            }
            if (window.confirm("Import this file? It will REPLACE all current data.")) {
              // normalize through loadData's migration path
              state = migrateLoaded(parsed);
              save();
              fullRender();
            }
          } catch (err) {
            window.alert("Could not read this file (invalid JSON).");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      }
    });

    append(root, el("footer", { class: "app-footer" },
      el("div", {}, "All data is stored locally on this device. No account, no servers."),
      el("div", { class: "footer-actions" },
        el("button", { class: "footer-btn", onclick: exportData }, "⬇ Export data"),
        el("button", { class: "footer-btn", onclick: function () { importInput.click(); } }, "⬆ Import data"),
        el("button", {
          class: "reset-btn",
          onclick: function () {
            if (window.confirm("Erase ALL budget data and start from zero? This cannot be undone.")) {
              try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
              state = loadData();
              fullRender();
            }
          }
        }, "Reset all data")
      ),
      importInput
    ));
    updateComputed();
  }

  /* ---------- PWA ---------- */
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  }
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    installEvent = e;
    fullRender();
  });

  fullRender();
})();
</script>
</body>
</html>
